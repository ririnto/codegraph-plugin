name: Verify Windows plugin execution
on:
  push:
    branches: [fix/hook-output]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 8
    env:
      CODEGRAPH_TELEMETRY: '0'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run installed-layout hooks and MCP on Windows
        shell: python
        run: |
          import json
          import os
          import shutil
          import subprocess
          import tempfile
          from pathlib import Path

          source = Path.cwd()
          base = Path(tempfile.mkdtemp(prefix="CodeGraph test "))
          package = base / "plugin package"
          shutil.copytree(source, package, ignore=shutil.ignore_patterns(".git", ".github"))
          git_bin = Path(os.environ["ProgramFiles"]) / "Git" / "bin"
          assert (git_bin / "sh.exe").is_file()
          os.environ["PATH"] = str(git_bin) + os.pathsep + os.environ["PATH"]
          env = {**os.environ, "CLAUDE_PLUGIN_ROOT": str(package)}
          def run(args, cwd=base):
              result = subprocess.run(args, cwd=cwd, env=env, timeout=120, capture_output=True, text=True)
              if result.returncode: raise RuntimeError((args, result.returncode, result.stderr, result.stdout))
              return result
          def read(name):
              return json.loads((package / name).read_text(encoding="utf-8"))
          for script in (package / "hooks").glob("*.sh"):
              assert b"\r" not in script.read_bytes()
          print(run(["sh", "-c", "git --version && npx --version && npx --yes @colbymchenry/codegraph --version"]).stdout, flush=True)
          env["npm_config_offline"] = "true"
          root = base / "working tree"
          run(["git", "init", "-q", str(root)])
          nested = root / "src"
          nested.mkdir()
          (nested / "fixture.js").write_text("export function windowsHookFixture() { return 1; }\n")
          env["CURSOR_PROJECT_DIR"] = str(nested)
          cursor = read(".cursor-plugin/plugin.json")["hooks"]["hooks"]["sessionStart"]
          shared = read("hooks/hooks.json")["hooks"]["SessionStart"][0]["hooks"]
          for h in cursor:
              run(["powershell.exe", "-NoProfile", "-NonInteractive", "-Command", h["command"]], package)
          assert (root / ".codegraph" / "codegraph.db").is_file()
          for h in shared:
              run(["sh", "-c", h["command"]], nested)
              expanded = h["command"].replace("${CLAUDE_PLUGIN_ROOT}", str(package))
              run(["powershell.exe", "-NoProfile", "-NonInteractive", "-Command", expanded], nested)
          assert not (package / ".codegraph").exists()
          excluded = (root / ".git/info/exclude").read_text().splitlines()
          assert excluded.count(".codegraph") == 1
          mcp = read("mcp.json")["mcpServers"]["codegraph"]
          claude = read(".claude-plugin/plugin.json")["mcpServers"]["codegraph"]
          assert (mcp["command"], mcp["args"]) == (claude["command"], claude["args"])
          p = subprocess.Popen([mcp["command"], *mcp["args"]], cwd=root, env={**env, **mcp["env"]}, stdin=subprocess.PIPE, stdout=subprocess.PIPE, text=True, encoding="utf-8")
          def send(message):
              p.stdin.write(json.dumps({"jsonrpc":"2.0", **message})+"\n")
              p.stdin.flush()
          def rpc(index, method, params):
              send({"id":index,"method":method,"params":params})
              for line in p.stdout:
                  msg=json.loads(line)
                  if msg.get("id")==index:
                      assert "error" not in msg, msg
                      return msg["result"]
              raise RuntimeError("MCP stopped before replying")
          info = rpc(1,"initialize",{"protocolVersion":"2025-03-26","clientInfo":{"name":"windows-smoke","version":"1"},"capabilities":{}})
          send({"method":"notifications/initialized"})
          assert any(t["name"]=="codegraph_explore" for t in rpc(2,"tools/list",{})["tools"])
          found = rpc(3,"tools/call",{"name":"codegraph_explore","arguments":{"query":"windowsHookFixture","projectPath":str(root)}})
          assert not found.get("isError") and "fixture.js" in str(found)
          p.stdin.close()
          p.wait(timeout=30)
          print("Windows hooks, Git exclusion and MCP symbol lookup passed:", info["serverInfo"]["version"])
