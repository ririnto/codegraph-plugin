name: Verify Cursor workspace arguments
on:
  push:
    branches: [release/align-plugin-versions]

permissions:
  contents: read

jobs:
  arguments:
    runs-on: windows-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Exercise Cursor commands in Windows shells
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          import shutil
          from subprocess import run
          from tempfile import TemporaryDirectory
          os.environ["PATH"] = str(Path(os.environ["ProgramFiles"]) / "Git" / "bin") + os.pathsep + os.environ["PATH"]
          commands=json.loads(Path(".cursor-plugin/plugin.json").read_text())["hooks"]["hooks"]["sessionStart"]
          with TemporaryDirectory(prefix="Cursor plugin ") as tmp:
              root=Path(tmp)
              (root/"hooks").mkdir()
              for name in ("init","exclude"):
                  (root/"hooks"/(name+".sh")).write_bytes(b'echo "$#"\necho "$1"\n')
              for h in commands:
                  for host in ("powershell.exe","pwsh.exe","sh"):
                      flags=["-c"] if host=="sh" else ["-NoProfile","-NonInteractive","-Command"]
                      for workspace in (None,"",str(root/"work tree & [test]")):
                          env=os.environ.copy()
                          env.pop("CURSOR_PROJECT_DIR",None)
                          if workspace is not None: env["CURSOR_PROJECT_DIR"]=workspace
                          r=run([host,*flags,h["command"]],cwd=root,env=env,text=True,capture_output=True)
                          assert (r.returncode,r.stdout.splitlines())==(0,["1",workspace or ""]),(host,h,r.returncode,r.stdout,r.stderr)
                      print(host,h["command"],"passed")
