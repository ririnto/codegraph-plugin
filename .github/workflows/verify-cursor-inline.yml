name: Verify Cursor workspace arguments
on:
  push:
    branches: [release/align-plugin-versions]

permissions:
  contents: read

jobs:
  arguments:
    runs-on: windows-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Exercise Cursor commands in Windows shells
        shell: python
        run: |
          import json, os, subprocess, shutil, tempfile
          from pathlib import Path
          win=os.name=='nt'
          if win:
              os.environ["PATH"]=str(Path(os.environ["ProgramFiles"])/"Git"/"bin")+os.pathsep+os.environ["PATH"]
          with tempfile.TemporaryDirectory(prefix='Cursor plugin ') as tmp:
              root=Path(tmp)
              (root/'hooks').mkdir()
              (root/'hooks/probe.sh').write_bytes(b'echo "$#"\necho "$1"\n')
              (root/'hooks/wrapper.sh').write_bytes(b'exec sh "$1" "${CURSOR_PROJECT_DIR-}"\n')
              variants={
                  'direct':'sh ./hooks/probe.sh "${CURSOR_PROJECT_DIR-}"',
                  'single':'sh -c \'exec sh ./hooks/probe.sh "$CURSOR_PROJECT_DIR"\'',
                  'tripled':'sh -c \'exec sh ./hooks/probe.sh """$CURSOR_PROJECT_DIR"""\'',
                  'case':'sh -fc \'IFS=; case $CURSOR_PROJECT_DIR in ?*) exec sh ./hooks/probe.sh $CURSOR_PROJECT_DIR;; esac\'',
                  'wrapper':'sh ./hooks/wrapper.sh ./hooks/probe.sh',
              }
              for name,cmd in variants.items():
                  for host in (['powershell.exe','pwsh.exe','sh'] if win else ['sh','bash','dash']):
                      flags=['-NoProfile','-NonInteractive','-Command'] if 'sh.exe' in host or host.startswith('powershell') else ['-c']
                      errors=[]
                      for v in (None,'','plain',str(root/'work tree & [test] (x)'),str(root/"test's $var"),str(root/'동작 확인')):
                          env={**os.environ}
                          env.pop('CURSOR_PROJECT_DIR',None)
                          if v is not None:env['CURSOR_PROJECT_DIR']=v
                          r=subprocess.run([host,*flags,cmd],cwd=root,env=env,capture_output=True,text=True,encoding='utf8',errors='replace')
                          got=r.stdout.splitlines()
                          expect=[] if name=='case' and not v else ['1',v or '']
                          if r.returncode or got!=expect:errors.append((v,got,r.returncode))
                      print('RESULT',host,name,'PASS' if not errors else 'FAIL',repr(errors[:3]),flush=True)
